name: Build Android 10 Screen Reader
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: trinh-doc-man-hinh-android10-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v0.1.0-build.${GITHUB_RUN_NUMBER}"
          gh release create "$tag" app/build/outputs/apk/debug/app-debug.apk \
            --title "Trình đọc màn hình Android 10 $tag" \
            --notes-file CHANGELOG.md
